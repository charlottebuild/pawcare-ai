name: CI

on:
  push:
  pull_request:

jobs:
  regression:
    name: Regression checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

      - name: Run backend and API tests
        run: pytest -q

      - name: Run Golden Dataset evaluation
        run: python -m pawcare.evaluation.golden_runner --report-json pawcare_eval_report.json

      - name: Upload Golden Dataset report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pawcare-eval-report
          path: pawcare_eval_report.json
          if-no-files-found: ignore
